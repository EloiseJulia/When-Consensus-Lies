# Render Blueprint (repo root) — free-tier deploy of the human-reliance oTree study.
# In Render: New + -> Blueprint -> pick this repo. Render reads THIS file.
# The oTree project lives in a subfolder, so each service sets rootDir.
services:
  - type: web
    name: reliance
    runtime: python
    plan: free                       # free web service (sleeps after ~15 min idle)
    rootDir: paper/studies/human-reliance/otree
    # resetdb creates the DB tables. NOTE: it runs on EVERY deploy and WIPES data, so once you
    # start collecting, do NOT push/redeploy until you have exported your data.
    buildCommand: pip install -r requirements.txt && otree resetdb --noinput
    startCommand: otree prodserver $PORT
    envVars:
      - key: OTREE_PRODUCTION
        value: "1"
      - key: OTREE_AUTH_LEVEL
        value: STUDY                 # locks the admin/demo behind the password; participant links stay open
      - key: OTREE_ADMIN_PASSWORD
        generateValue: true          # see it in Render -> your service -> Environment
      - key: OTREE_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        fromDatabase:
          name: reliance-db
          property: connectionString

databases:
  - name: reliance-db
    plan: free                       # free Postgres (persists data; the free plan expires ~30 days)

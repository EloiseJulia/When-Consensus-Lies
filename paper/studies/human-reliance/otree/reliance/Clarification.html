{{ block title }}{{ progress }}{{ endblock }}
{{ block content }}
{{ wrap_open }}

<div style="margin-top:16px;padding:12px;background:#fafafa;border-radius:6px;">
  <p style="font-weight:600;">{{ T.gap_q }}</p>
  {{ for o in options }}
  <label style="display:block;margin:7px 0;">
    <input type="radio" name="gap_choice" value="{{ o.i }}" {{ if saved_gap == o.i }}checked{{ endif }}> {{ o.text }}
  </label>
  {{ endfor }}
  <label style="display:block;margin:7px 0;">
    <input type="radio" name="gap_choice" value="4" {{ if saved_gap == 4 }}checked{{ endif }}> {{ T.other_option }}
  </label>
</div>

<button type="submit" class="btn btn-primary" style="margin-top:16px;">{{ T.next }}</button>
<button type="button" onclick="back_button()" class="btn btn-secondary" style="margin-top:16px;">{{ T.back }}</button>
{{ wrap_close }}
{{ endblock }}

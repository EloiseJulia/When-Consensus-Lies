# Role-based model routing with provenance separation (HARD LAW 6)
# constructor ≠ tested ≠ judge ≠ code_reviewer must be different model families

roles:
  constructor:
    # Builds benchmark / latent spec / deletion-based ambiguity
    family: google
    model: gemini-1.5-pro

  tested_agents:
    # The agents being studied (core experimental subjects)
    homogeneous:
      - family: anthropic
        model: claude-3-5-sonnet-20241022
    heterogeneous:
      - family: openai
        model: gpt-4-turbo
      - family: anthropic
        model: claude-3-5-sonnet-20241022
      - family: qwen
        model: qwen-plus
      - family: deepseek
        model: deepseek-chat
    reasoning:
      - family: openai
        model: o3-mini
      - family: deepseek
        model: deepseek-reasoner

  judge:
    # Only when executable gold unavailable; must differ from constructor
    family: openai
    model: gpt-4-turbo

  code_reviewer:
    # Reviews AI-written code; must differ from implementer
    family: anthropic
    model: claude-3-5-sonnet-20241022

seeds:
  global: 20260713

# Role-based model routing with provenance separation (HARD LAW 6)
# Amendment 06 (SIGNED 2026-07-18): Registered run on Copilot-proxy frontier roster.
#
# Hard Law 6 (inviolable): constructor(microsoft) ∉ tested{openai,anthropic,google}.
# Judge is also microsoft (same as constructor) and also outside the tested pool —
# both serve meta roles only; neither contaminates the experiment.
#
# Proxy slugs verified live 2026-07-18 against http://127.0.0.1:8313/v1/models.
# Bare slugs (no provider/ prefix) — copilot_proxy protocol.
#
# Family mapping: gpt*→openai, claude*→anthropic, gemini*→google, mai-code*→microsoft.
#
# providers.default stays github_models for backward-compat;
# the registered run passes --provider copilot_proxy explicitly.

roles:
  constructor:
    # Microsoft: outside every tested pool → clean cross-family construction (R2).
    family: microsoft
    model: mai-code-1-flash-picker

  tested_agents:
    homogeneous:
      # gpt-5.4: shared-prior ρ-baseline (openai, logprobs-capable via copilot_proxy).
      - family: openai
        model: gpt-5.4

    heterogeneous:
      # 3-family cross-model pool for H1 cross-family CD measurement (row-35 headline).
      - family: openai
        model: gpt-5.4
      - family: anthropic
        model: claude-sonnet-4.6
      - family: google
        model: gemini-3.1-pro-preview

    reasoning:
      # H2 test: frontier reasoning models, 3 families.
      - family: openai
        model: gpt-5.6-sol
      - family: anthropic
        model: claude-opus-4.8
      - family: google
        model: gemini-3.1-pro-preview

    weak:
      # H2 contrast: non-frontier baselines for reasoner-vs-weak split.
      - family: openai
        model: gpt-4o-mini
      - family: google
        model: gemini-3.5-flash
      - family: anthropic
        model: claude-haiku-4.5

  judge:
    # Microsoft: outside tested pool. Used only when executable gold unavailable.
    # Same family as constructor; both are outside the experiment tested pool.
    family: microsoft
    model: mai-code-1-flash-picker

  code_reviewer:
    # openai/gpt-5.6-sol — CODE-AUDIT routing only; orthogonal to the experiment
    # provenance requirements. Reviewer may share a family with the tested pool
    # since per-item family separation is enforced at run time.
    family: openai
    model: gpt-5.6-sol

seeds:
  global: 20260713

# ── Provider abstraction (shared-infra) ────────────────────────────────────────
# Selects the online endpoint + request shape WITHOUT changing the experiment
# roster above. `default` picks the provider when LLMClient(provider=...) is not
# given explicitly; keep it `github_models` so existing behavior is unchanged.
# The `copilot_proxy` block targets the local, OpenAI-compatible GitHub Copilot
# API proxy (ghc-api): NO auth token, effectively unlimited quota, frontier models
# across families. base_url is configurable (host/port may vary). The frontier
# roster itself is pending owner sign-off (Amendment 06 DRAFT) and is intentionally
# NOT hardcoded here.
providers:
  default: github_models
  github_models:
    base_url: https://models.github.ai/inference
    require_auth: true
  copilot_proxy:
    base_url: http://127.0.0.1:8313/v1
    require_auth: false
    # Proxy slugs that reject a `temperature` field (HTTP 400); temperature is
    # omitted for any slug containing one of these substrings. Empirically probed
    # 2026-07-17. Editable as the roster evolves.
    no_temperature_models:
      - gpt-5.6
      - mai-code

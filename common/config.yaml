# Role-based model routing with provenance separation (HARD LAW 6)
# constructor ≠ tested ≠ judge ≠ code_reviewer must be different model families.
#
# Endpoint: https://models.github.ai/inference (OpenAI-compatible)
# Token env: GITHUB_MODELS_TOKEN or GH_MODELS_TOKEN (User-scope; never logged)
#
# Anthropic and Google are NOT on GitHub Models → dropped from experiment routing.
# Build/audit provenance (Claude-impl / GPT-audit) is CODE provenance, orthogonal
# to the experiment family-distinctness requirement.
#
# Option-B family table (owner-approved 2026-07-15 — all experiment roles mutually distinct):
#   constructor(cohere) ∉ tested{openai,meta,mistral-ai,deepseek}
#   judge(microsoft)   ∉ tested ∪ {constructor(cohere)}
#   ✓ Hard Law 6 satisfied
#
# Reasoning pool finalized 2026-07-15 after live token verification:
#   openai/o4-mini confirmed reachable (160 req/60s; logprobs NOT supported →
#   verbalized confidence; this is expected behaviour for reasoning models).

roles:
  constructor:
    # Cohere: outside every tested pool → clean cross-family construction control (R2).
    family: cohere
    model: cohere/cohere-command-a

  tested_agents:
    homogeneous:
      # OpenAI gpt-4o-mini: shared-prior ρ-baseline (owner-ruled: strongest deployed
      # shared prior + ONLY family on GitHub Models exposing logprobs → logit_conf
      # signal available for the silent-failure signature).
      - family: openai
        model: openai/gpt-4o-mini

    heterogeneous:
      # 4-family diverse mix for H1 cross-family baseline measurement.
      - family: openai
        model: openai/gpt-4o-mini
      - family: meta
        model: meta/llama-3.3-70b-instruct
      - family: mistral-ai
        model: mistral-ai/mistral-small-2503
      - family: deepseek
        model: deepseek/deepseek-v3-0324

    reasoning:
      # H2 test: frontier reasoners — both verified reachable on GitHub Models.
      # deepseek-r1: strong open-weight reasoning baseline.
      # openai/o4-mini: verified frontier reasoner (2026-07-15 live token check;
      #   160 req/60s rate limit; logprobs NOT supported → verbalized confidence
      #   only — expected behaviour for reasoning-trace models).
      # Hard Law 6: openai + deepseek are already in the tested pool; no new
      # family introduced; constructor(cohere) + judge(microsoft) remain outside.
      - family: deepseek
        model: deepseek/deepseek-r1
      - family: openai
        model: openai/o4-mini

  judge:
    # microsoft/phi-4: NOT in any tested pool (phi-4-reasoning purposely avoided
    # to keep phi-4 clean as judge). Used only when executable gold is unavailable.
    family: microsoft
    model: microsoft/phi-4

  code_reviewer:
    # PLACEHOLDER — Manager overrides per slice so auditor family ≠ implementer.
    # This is CODE-AUDIT routing only; orthogonal to the experiment provenance
    # requirements. Default: mistral-ai (distinct from constructor/judge/homogeneous).
    family: mistral-ai
    model: mistral-ai/mistral-medium-2505

seeds:
  global: 20260713
